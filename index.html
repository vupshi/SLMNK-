<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLMNK</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Підключення зовнішнього CSS файлу -->
</head>
<body>
    <div class="container">
        <h1 class="glitch" data-text="SLMNK">SLMNK</h1>
        <div class="spotify-player">
            <iframe id="spotifyIframe" src="https://open.spotify.com/track/1ULh943IZU23kuU1LbByDb?si=3fc5405937b745ae" width="300" height="80" frameBorder="0" allowtransparency="true" allow="encrypted-media"></iframe>
            <!-- Віджет плеєра Spotify для прослуховування треку -->
        </div>
        <div class="social-links">
            <a href="https://open.spotify.com/artist/525siLcTpPh7AiUTcPJUs8?si=vSQqAdjITWGGQiOsNGhYRg" target="_blank" class="btn">Spotify</a>
            <!-- Перехід на сторінку виконавця в Spotify -->

            <a href="https://soundcloud.com/zhenya_optimist" target="_blank" class="btn">Soundcloud</a>
            <!-- Перехід на сторінку виконавця в Soundcloud -->

            <a href="https://t.me/zhenya_optimist" target="_blank" class="btn">Telegram</a>
            <!-- Перехід на канал виконавця в Telegram -->

            <a href="https://www.youtube.com/channel/UCK73-9UxUFlelqqAUKfaqUA" target="_blank" class="btn">YouTube</a>
            <!-- Перехід на канал виконавця в YouTube -->

            <a href="https://www.tiktok.com/@zhenya_optimist" target="_blank" class="btn">TikTok</a>
            <!-- Перехід на сторінку виконавця в TikTok -->
        </div>
    </div>

    <script>
        // Логування початку завантаження плеєра
        console.log("Завантаження iframe плеєра почалося");

        // Отримуємо iframe елемент
        const spotifyIframe = document.getElementById('spotifyIframe');

        // Логування успішного завантаження
        spotifyIframe.onload = function() {
            console.log("Iframe плеєр успішно завантажений");
        };

        // Логування помилки при завантаженні плеєра
        spotifyIframe.onerror = function() {
            console.error("Помилка при завантаженні iframe плеєра");
        };

        // Перевірка підключення до інтернету
        if (navigator.onLine) {
            console.log("Інтернет-з'єднання активне");
        } else {
            console.error("Немає інтернет-з'єднання");
        }

        // Перевірка наявності Spotify плеєра
        if (!spotifyIframe.src) {
            console.error("Джерело iframe порожнє");
        } else {
            console.log("Джерело iframe: " + spotifyIframe.src);
        }
    </script>
</body>
</html>
